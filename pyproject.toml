[project]
name = "turquoise-radar"
version = "0.1.0"
description = "Private jewelry sourcing intelligence, local-first foundation"
requires-python = ">=3.12"
dependencies = ["fastapi==0.119.1", "uvicorn==0.38.0", "jinja2==3.1.6", "sqlalchemy==2.0.44", "pydantic==2.12.3", "httpx==0.28.1", "python-multipart==0.0.20"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
