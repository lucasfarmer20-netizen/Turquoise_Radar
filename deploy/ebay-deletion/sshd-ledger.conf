# Install as /etc/ssh/sshd_config.d/00-ebay-ledger.conf; validate before reloading SSH.
# This account has no admin rights. Admins use a separate OS Login identity through IAP.
Match User ebay-ledger-pull
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/authorized_keys/ebay-ledger-pull
    AuthorizedKeysCommand none
    ForceCommand /usr/bin/sudo -n -u ebay-receiver /opt/ebay-receiver/.venv/bin/python -I /opt/ebay-receiver/deploy/ebay-deletion/snapshot-queue.py
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
    PermitTunnel no
    X11Forwarding no
Match all
